name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # GHCR rejects uppercase image paths and this repository lives under the
      # mixed-case "BroLabel" org, so normalize the owner instead of hardcoding it.
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test release candidate
        run: GOWORK=off go test ./cmd/co-signer ./internal/health

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive publication metadata
        id: release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REF: ${{ github.ref }}
          REVISION: ${{ github.sha }}
        run: |
          version=$(<VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain plain SemVer, got: '$version'" >&2
            exit 1
          fi

          case "$REF" in
            refs/heads/main)
              tags="$IMAGE:latest,$IMAGE:sha-$REVISION"
              ;;
            refs/tags/v*)
              if [[ "$REF" != "refs/tags/v$version" ]]; then
                echo "Git tag must match VERSION: got '$REF', expected 'refs/tags/v$version'" >&2
                exit 1
              fi
              tags="$IMAGE:v$version"
              ;;
            *)
              echo "Unsupported publication ref: $REF" >&2
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.revision }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Off by design: BuildKit otherwise attaches in-toto attestation
          # manifests that GHCR lists as untagged "unknown/unknown" versions
          # alongside the real image, which is actively misleading when
          # checking what was published.
          provenance: false
          sbom: false

      - name: Record published manifest digest
        run: |
          echo "Published digest: ${{ steps.build.outputs.digest }}"
